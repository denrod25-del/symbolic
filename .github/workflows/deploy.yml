name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + build + restart on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/symbolic
            echo "== Pulling latest main =="
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline
            echo "== Installing dependencies =="
            npm ci
            echo "== Building Next.js =="
            npx next build
            echo "== Restarting pm2 =="
            pm2 restart symbolic --update-env
            pm2 status

            # NOTE: database migrations are NOT applied here.
            # If your push includes a new file in migrations/, run it manually on the VPS:
            #   PGPASSWORD=symbolic_pass psql -h localhost -U symbolic -d symbolic -f migrations/<file>.sql
            # Then re-run this workflow (Actions tab → Deploy to production → Run workflow).
