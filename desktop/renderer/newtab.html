<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #12121a;
        --border: #1e1e2e;
        --accent: #7c6ff7;
        --muted: #6b7280;
        --text: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      .wordmark {
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-shadow: 0 0 40px rgba(124, 111, 247, 0.5);
      }
      .wordmark span {
        color: var(--accent);
      }
      .tagline {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .engine-badge {
        margin-top: 0.25rem;
        font-size: 0.7rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .engine-badge strong {
        color: var(--accent);
      }
      form {
        width: min(40rem, 90vw);
      }
      input {
        width: 100%;
        padding: 0.85rem 1.5rem;
        border-radius: 9999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      #recent {
        width: min(40rem, 90vw);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #recent[hidden] {
        display: none;
      }
      .recent-heading {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .recent-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .recent-chip {
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 0.8rem;
        text-decoration: none;
      }
      .recent-chip:hover {
        border-color: var(--accent);
      }
      .shortcuts {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        justify-content: center;
        max-width: 40rem;
      }
      .shortcut {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        width: 5rem;
        text-decoration: none;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .tile {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text);
        background: var(--border);
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <div class="wordmark">symbolic<span>.</span></div>
      <p class="tagline">Search without compromise</p>
      <p class="engine-badge">Default search: <strong>Symbolic</strong></p>
    </div>

    <form id="search">
      <input
        id="q"
        type="text"
        autofocus
        spellcheck="false"
        placeholder="Search the web or type a URL"
      />
    </form>

    <div id="recent" hidden></div>

    <div class="shortcuts" id="shortcuts"></div>

    <script src="newtab.js"></script>
  </body>
</html>
