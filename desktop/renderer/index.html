<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self'"
    />
    <title>Symbolic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="tabstrip">
      <div id="tabs"></div>
      <button
        id="new-tab"
        type="button"
        aria-label="New tab"
        title="New tab (Ctrl+T)"
      >
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <button
        id="new-private-tab"
        type="button"
        aria-label="New private tab"
        title="New private tab (Ctrl+Shift+N)"
      >
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M2 12h20" />
          <path d="M5 12V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v5" />
          <circle cx="8" cy="16" r="3" />
          <circle cx="16" cy="16" r="3" />
          <path d="M11 16h2" />
        </svg>
      </button>
    </div>

    <div id="toolbar">
      <button id="back" type="button" aria-label="Back" title="Back (Alt+Left)">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <button
        id="forward"
        type="button"
        aria-label="Forward"
        title="Forward (Alt+Right)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <button
        id="reload"
        type="button"
        aria-label="Reload"
        title="Reload (Ctrl+R)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
      </button>
      <button id="home" type="button" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
      </button>

      <form id="omnibox-form">
        <svg id="omnibox-lock" viewBox="0 0 24 24" width="14" height="14">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <span id="private-badge" hidden>Private</span>
        <input
          id="omnibox"
          type="text"
          spellcheck="false"
          placeholder="Search Symbolic or type a URL"
        />
      </form>

      <button
        id="add-bookmark"
        type="button"
        aria-label="Bookmark this page"
        title="Bookmark this page (Ctrl+D)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
      </button>

      <button
        id="downloads-btn"
        type="button"
        aria-label="Downloads"
        title="Downloads (Ctrl+J)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
      </button>

      <button
        id="palette-btn"
        type="button"
        aria-label="Command palette"
        title="Command palette (Ctrl+K)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="m7 8-4 4 4 4" />
          <path d="m17 8 4 4-4 4" />
          <path d="m14 4-4 16" />
        </svg>
      </button>

      <button
        id="open-external"
        type="button"
        aria-label="Open in system browser"
        title="Open in system browser"
      >
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M15 3h6v6" />
          <path d="M10 14 21 3" />
          <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
        </svg>
      </button>
    </div>

    <div id="findbar" hidden>
      <input
        id="find-input"
        type="text"
        spellcheck="false"
        placeholder="Find in page"
      />
      <span id="find-count"></span>
      <button id="find-prev" type="button" aria-label="Previous match">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path d="m18 15-6-6-6 6" />
        </svg>
      </button>
      <button id="find-next" type="button" aria-label="Next match">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <button id="find-close" type="button" aria-label="Close find bar">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div id="bookmarks-bar">
      <div id="bookmarks-list"></div>
      <span id="bookmarks-hint">Right-click a bookmark to remove</span>
    </div>

    <div id="views"></div>

    <div id="downloads-panel" hidden>
      <div class="panel-header">
        <span>Downloads</span>
        <button id="downloads-close" type="button" aria-label="Close downloads">
          ✕
        </button>
      </div>
      <div id="downloads-list"></div>
      <p id="downloads-empty">No downloads yet.</p>
    </div>

    <div id="palette" hidden>
      <div id="palette-box">
        <input
          id="palette-input"
          type="text"
          spellcheck="false"
          placeholder="Type a command…"
        />
        <ul id="palette-list"></ul>
      </div>
    </div>

    <div id="reader" hidden>
      <div id="reader-toolbar">
        <span id="reader-title"></span>
        <button id="reader-close" type="button" aria-label="Close reader">
          ✕
        </button>
      </div>
      <div id="reader-scroll">
        <div id="reader-body"></div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
