<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self'"
    />
    <title>Symbolic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="new-tab" type="button" aria-label="New tab" title="New tab">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <div id="toolbar">
      <button id="back" type="button" aria-label="Back" title="Back">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
      <button id="forward" type="button" aria-label="Forward" title="Forward">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
      <button id="reload" type="button" aria-label="Reload" title="Reload">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
      </button>
      <button id="home" type="button" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M3 10.5 12 3l9 7.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
      </button>

      <form id="omnibox-form">
        <svg id="omnibox-lock" viewBox="0 0 24 24" width="14" height="14">
          <rect x="3" y="11" width="18" height="11" rx="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          id="omnibox"
          type="text"
          spellcheck="false"
          placeholder="Search Symbolic or type a URL"
        />
      </form>

      <button
        id="open-external"
        type="button"
        aria-label="Open in system browser"
        title="Open in system browser"
      >
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M15 3h6v6" />
          <path d="M10 14 21 3" />
          <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
        </svg>
      </button>
    </div>

    <div id="views"></div>

    <script src="renderer.js"></script>
  </body>
</html>
